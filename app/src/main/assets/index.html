<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111214">
<title>RocknRona – פרומפטר מילים</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#111214;--p1:#1A1C20;--p2:#15171A;--fld:#1B1D22;--ln:#26292F;--ln2:#2E3138;--tx:#F2EEE6;--mu:#A09A90;--mu2:#8F897F;--am:#E8A33D;--amT:#2A2419;--amB:#4A3E28;--ve:#E8A33D;--ch:#7DB8F0;--br:#C9A6F0;--no:#8F897F;--ui:'Assistant','Segoe UI',sans-serif;--ti:'Rubik','Assistant',sans-serif;--bf:'Frank Ruhl Libre',Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--ui);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--am);outline-offset:2px}
svg{flex-shrink:0}
[hidden]{display:none!important}
select option{background:#1A1C20;color:#F2EEE6}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}
.hdr{height:76px;padding:0 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--ln);flex-shrink:0}
.flex1{flex:1}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.btn{height:46px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--fld);color:var(--tx);border:1px solid var(--ln2);border-radius:12px;font-size:16px;font-weight:600;white-space:nowrap;flex-shrink:0}
.btn:active:not(:disabled),.ib:active:not(:disabled),.pb:active:not(:disabled){transform:scale(.96)}
.btn.pri{background:var(--am);color:#111214;border-color:var(--am);font-weight:800}
.btn.dash{background:transparent;border-style:dashed}
.btn.sm{height:40px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.big{height:54px;font-size:18px;border-radius:14px;width:100%}
.ib{width:46px;height:46px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:var(--fld);color:var(--tx);border:1px solid var(--ln2);border-radius:12px;flex-shrink:0}
.ib.sm{width:40px;height:40px;border-radius:10px}
.ib.ghost{background:transparent;border-color:transparent;color:var(--mu)}
.ib.danger{color:#FF9A8F}
.lbl{font-size:13px;font-weight:700;color:var(--mu2);letter-spacing:.3px}
.hint{font-size:13px;color:var(--mu2);line-height:1.55;padding:6px 4px}
.seg{display:flex;gap:4px;background:var(--fld);padding:4px;border-radius:11px;border:1px solid var(--ln2);flex-shrink:0}
.seg button{height:38px;padding:0 14px;background:transparent;color:var(--mu);border:0;border-radius:8px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.seg button.on{background:var(--ln2);color:var(--tx);font-weight:700}
.seg.full button{flex:1}
.field{height:46px;padding:0 14px;background:var(--fld);border:1px solid var(--ln2);border-radius:12px;font-size:16px;color:var(--tx);outline:none;width:100%}
.pill{width:24px;height:24px;border-radius:6px;color:#111214;font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.t-verse{background:var(--ve)}.t-chorus{background:var(--ch)}.t-bridge{background:var(--br)}.t-note{background:var(--no)}
.c-verse{color:#F3D9A8}.c-chorus{color:#A9D2FA}.c-bridge{color:#D8C2F5}.c-note{color:#9A958C}
.spin{width:22px;height:22px;border:3px solid #34373D;border-top-color:var(--am);border-radius:50%;display:inline-block;animation:sp .8s linear infinite}
.spin.big{width:42px;height:42px;border-width:4px}
@keyframes sp{to{transform:rotate(360deg)}}
.tgl{display:flex;align-items:center;gap:10px;font-size:15px;min-height:44px;cursor:pointer}
.tgl input{width:22px;height:22px;accent-color:var(--am);flex-shrink:0}
input[type=range]{accent-color:var(--am);width:100%;height:32px}

/* library */
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:11px;background:var(--am);color:#111214;display:flex;align-items:center;justify-content:center}
.logoImg{height:46px;width:auto;display:block}
.brand span{font-size:15px;color:var(--mu);padding-top:6px}
.search{width:320px;height:46px;padding:0 14px;display:flex;align-items:center;gap:10px;background:var(--fld);border:1px solid var(--ln2);border-radius:12px;color:var(--mu)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:16px;color:var(--tx)}
.libBody{flex:1;display:flex;min-height:0}
.nav{width:264px;padding:22px 16px;border-left:1px solid var(--ln);display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.navLbl{padding:14px 12px 6px}
.foldRow{display:flex;align-items:center;border-radius:10px;flex-shrink:0}
.foldRow.on{background:var(--amT)}
.fold{flex:1;min-width:0;height:48px;padding:0 12px;display:flex;align-items:center;gap:12px;background:transparent;color:#D8D3CA;border:0;border-radius:10px;font-size:16px;text-align:right}
.foldRow.on .fold{color:#F4C77A}
.fold .nm{flex:1;font-family:var(--ti);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold .ct{color:var(--mu2);font-size:14px}
.foldRow.on .ct{color:#F4C77A}
.fmore{width:40px;height:40px;margin-left:4px;display:none;align-items:center;justify-content:center;background:transparent;border:0;border-radius:8px;color:#F4C77A}
.foldRow.on .fmore{display:flex}
.newFold{margin-top:10px;color:var(--am);border-color:#4A4032;justify-content:flex-start;font-size:15px;font-weight:700}
.legend{margin-top:18px;padding:16px;background:var(--fld);border-radius:14px;display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.legend div{display:flex;align-items:center;gap:10px;font-size:15px}
.legend i{width:14px;height:14px;border-radius:4px;display:block}
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:24px 28px 20px;gap:18px}
.mhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.mhead h1{margin:0;font-family:var(--ti);font-size:32px;font-weight:600;letter-spacing:-.3px;line-height:1.2}
.mhead .sub{color:var(--mu);font-size:15px;margin-top:4px}
.grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-content:start;padding:2px 2px 8px}
.card{background:var(--p1);border:1px solid #2A2D33;border-radius:16px;display:flex;align-items:stretch;min-height:112px}
.cardOpen{flex:1;min-width:0;padding:16px 18px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;background:transparent;border:0;color:var(--tx);text-align:right;border-radius:16px}
.cardOpen .ttl{font-family:var(--ti);font-size:20px;font-weight:600;letter-spacing:-.2px;line-height:1.25;display:flex;align-items:center;gap:6px}
.favS{color:var(--am);display:inline-flex}
.cardOpen .art{font-size:14px;color:var(--mu);margin-top:-6px;min-height:18px}
.pills{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.pills .more,.pdfInfo{font-size:13px;color:var(--mu)}
.cardOpen .meta{font-size:13px;color:var(--mu2);margin-top:auto}
.side{display:flex;flex-direction:column;gap:6px;padding:12px 12px 12px 0;align-items:center}
.playBtn{width:46px;height:46px;border-radius:50%;background:var(--ln2);color:var(--tx);border:0;display:flex;align-items:center;justify-content:center}
.playBtn:active{background:var(--am);color:#111214}
.badge{height:24px;padding:0 9px;border-radius:12px;background:#2B2230;color:#D9BFF5;font-size:12px;font-weight:800;display:inline-flex;align-items:center}
.setbar{height:72px;padding:0 20px;display:flex;align-items:center;gap:16px;background:#1F1B14;border:1px solid #3D3322;border-radius:16px;flex-shrink:0;color:var(--am)}
.sbTxt{min-width:0;color:var(--tx)}
.sbTxt b{display:block;font-size:17px;font-weight:800}
.sbTxt span{display:block;font-size:14px;color:#BFB39E;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navTop{display:flex;justify-content:flex-end;margin:-8px 0 8px}
#lib.navHidden .nav{display:none}
.grid.asList{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;background:var(--p1);border:1px solid #2A2D33;border-radius:12px;min-height:62px;flex-shrink:0}
.lOpen{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:8px 16px;background:transparent;border:0;color:var(--tx);text-align:right;min-height:60px;border-radius:12px}
.lNum{width:26px;color:var(--mu2);font-size:15px;font-weight:700;text-align:center;flex-shrink:0}
.lTitle{font-family:var(--ti);font-size:18px;font-weight:600;min-width:0;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.lArt{flex:1;min-width:0;color:var(--mu);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .pills{flex-wrap:nowrap;flex-shrink:0}
.lside{display:flex;gap:6px;padding:0 10px;align-items:center}
.playBtn.sm{width:40px;height:40px}
@media (max-width:760px){.lrow .pills{display:none}}
.emptyLib{grid-column:1/-1;padding:70px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;color:var(--mu)}
.emptyLib h2{margin:0;color:var(--tx);font-family:var(--ti);font-weight:600;font-size:24px}
.emptyLib div{display:flex;gap:10px}

/* editor */
.edTitles{min-width:0;display:flex;flex-direction:column}
.titleIn{background:transparent;border:0;outline:none;font-family:var(--ti);font-size:25px;font-weight:600;color:var(--tx);padding:0;width:340px;max-width:100%}
.edSub{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mu)}
.edSub input{background:transparent;border:0;outline:none;color:var(--mu);font-size:14px;width:140px;padding:0}
.edSub select{background:transparent;border:0;color:var(--mu);font-size:14px;outline:none;max-width:170px}
.edBody{flex:1;display:flex;min-height:0}
.struct{width:236px;padding:20px 14px;border-left:1px solid var(--ln);display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.struct .lbl{padding:0 6px 6px}
.sItem{display:flex;align-items:center;gap:2px;background:var(--p1);border-radius:10px;flex-shrink:0}
.sName{flex:1;min-width:0;height:46px;padding:0 10px;display:flex;align-items:center;gap:10px;background:transparent;border:0;color:var(--tx);font-size:16px;text-align:right;border-radius:10px}
.sName .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.sName .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sName .rep{font-size:12px;color:var(--mu2)}
.mv{width:34px;height:40px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:8px;color:var(--mu)}
.edMain{flex:1;min-width:0;padding:20px 24px 40px;display:flex;flex-direction:column;gap:14px}
.block{background:var(--p1);border:1px solid #2A2D33;border-radius:16px;padding:12px 18px 14px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.block:focus-within{border-color:var(--amB)}
.block.ref{background:#16181B;border-style:dashed}
.bHead{display:flex;align-items:center;gap:8px}
.chip{height:30px;padding:0 12px;border-radius:8px;color:#111214;font-size:14px;font-weight:800;border:0;-webkit-appearance:none;appearance:none;display:inline-flex;align-items:center;flex-shrink:0}
select.chip{cursor:pointer}
.bHead .cnt{font-size:13px;color:var(--mu2)}
.block textarea{resize:none;background:transparent;border:0;outline:none;font-size:22px;font-weight:700;line-height:1.55;padding:0;width:100%;overflow:hidden;min-height:34px}
.block textarea::placeholder{color:#5C5850;font-weight:500}
.reptext{font-size:18px;color:#6E695F;white-space:pre-line;line-height:1.5}
.addRow{display:flex;gap:10px;flex-wrap:wrap;flex-shrink:0}
.addRow.mini{gap:6px;margin:-4px 0 6px}
.addRow.mini .btn{height:36px;padding:0 11px;font-size:13px;border-radius:9px}
.ad-verse{color:var(--ve)!important;border-color:#4A4032!important}
.ad-chorus{color:var(--ch)!important;border-color:#2C4056!important}
.ad-bridge{color:var(--br)!important;border-color:#43385A!important}
.ad-note{color:var(--mu)!important}
.emptyEd{max-width:780px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.emptyEd h2{margin:6px 0 0;font-family:var(--ti);font-size:24px;font-weight:600}
.emptyEd p{margin:0;color:var(--mu);font-size:15px;line-height:1.6}
.bigText{min-height:320px;resize:vertical;background:var(--p1);border:1px solid var(--ln2);border-radius:14px;padding:16px 18px;font-size:19px;line-height:1.6;color:var(--tx);outline:none;width:100%}
.style{width:300px;padding:20px;border-right:1px solid var(--ln);background:var(--p2);display:flex;flex-direction:column;gap:20px;flex-shrink:0}
.grp{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px}
.row b{font-size:16px;font-weight:800}
.fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fontBtn{height:54px;background:var(--fld);color:var(--tx);border:1px solid var(--ln2);border-radius:10px;font-size:18px;padding:0 6px}
.fontBtn:last-child:nth-child(odd){grid-column:1/-1}
.fontBtn.on{background:var(--amT);color:#F4C77A;border-color:var(--am)}
.swRow{display:flex;align-items:center;gap:7px}
.swRow .nm{width:50px;font-size:15px;flex-shrink:0}
.sw{width:30px;height:30px;border-radius:50%;border:0;padding:0;flex-shrink:0}
.sw.on{box-shadow:0 0 0 2px var(--p2),0 0 0 4px var(--am)}
.swRow input[type=color]{width:32px;height:32px;border:1px dashed #555;padding:2px;background:transparent;border-radius:50%;flex-shrink:0}
.preview{padding:16px;background:#000;border-radius:12px;display:flex;flex-direction:column;gap:4px}
.pvL{font-size:11px;color:var(--mu2);text-align:center}
.pdfCard{display:flex;gap:24px;align-items:flex-start;background:var(--p1);border:1px solid #2A2D33;border-radius:16px;padding:20px;flex-wrap:wrap}
.pdfPrev{width:260px;min-height:200px;display:flex;align-items:center;justify-content:center;background:#0C0D0F;border-radius:8px;overflow:hidden}
.pdfPrev canvas{width:100%;height:auto;display:block}
.pdfInfoBox{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pdfInfoBox b{font-family:var(--ti);font-size:20px;font-weight:600}
.pdfInfoBox span{color:var(--mu)}
.pdfInfoBox p{color:var(--mu);line-height:1.6;margin:4px 0 8px}

/* prompter */
#play{background:#000}
.pTop{height:56px;padding:0 12px 0 24px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.pTop .t{font-family:var(--ti);font-size:18px;font-weight:600;color:#CFC9BF;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pTop .n{font-size:15px;color:var(--mu2);white-space:nowrap}
.pTop .tm{font-size:18px;font-weight:700;color:#CFC9BF;font-variant-numeric:tabular-nums}
.prog{height:3px;background:#1C1C1C;margin:0 24px;flex-shrink:0}
.prog i{display:block;height:3px;background:var(--am);width:0}
.pStage{flex:1;position:relative;min-height:0}
.pScroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}
.pScroll::-webkit-scrollbar{display:none}
.pInner{padding:38vh 64px 72vh;max-width:1240px;margin:0 auto;font-weight:800}
.pInner.mirror{transform:scaleX(-1)}
.ln{line-height:var(--lh,1.35);opacity:.7;transition:opacity .25s}
.ln.past{opacity:.25}
.ln.cur{opacity:1}
.ln.note{font-size:.45em;font-style:italic;font-weight:600;font-family:var(--ui)}
.sec{font-family:var(--ui);font-size:max(16px,.26em);font-weight:800;letter-spacing:1px;margin:.9em 0 .1em;opacity:.85}
.gap{height:.45em}
.endHint{font-family:var(--ui);text-align:center;color:var(--mu2);font-size:20px;font-weight:600;padding:50px 0 0}
.pInner.pdf{padding:20px 24px 60vh;max-width:1150px}
.pdfPage{display:block;max-width:100%;height:auto;margin:0 auto 16px;border-radius:4px;background:#fff}
.pInner.pdf.inv .pdfPage{filter:invert(1) hue-rotate(180deg)}
.pLoad{color:var(--mu);font-size:18px;font-weight:600;display:flex;gap:12px;align-items:center;justify-content:center;padding-top:30vh}
.marker{position:absolute;right:16px;top:38%;width:0;height:0;border-top:14px solid transparent;border-bottom:14px solid transparent;border-right:18px solid var(--am);transform:translateY(-50%);pointer-events:none}
.pBarWrap{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:center;pointer-events:none;padding:0 12px}
.pBar{pointer-events:auto;height:84px;padding:0 16px;display:flex;align-items:center;gap:12px;background:rgba(20,21,23,.95);border:1px solid #2A2D33;border-radius:22px;max-width:100%}
.pb{width:48px;height:48px;background:#1F2125;color:var(--tx);border:0;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex-shrink:0}
.pb.big{width:62px;height:62px;border-radius:50%;background:var(--am);color:#111214}
.pb.clear{background:transparent;color:#CFC9BF}
.pb.on{background:var(--amT);color:#F4C77A}
.pb.wide{width:auto;padding:0 14px;gap:6px;font-size:14px;font-weight:700;color:#CFC9BF}
.vsep{width:1px;height:40px;background:#2A2D33;flex-shrink:0}
.spd{width:74px;text-align:center}
.spd b{display:block;font-size:20px;font-weight:800}
.spd small{font-size:12px;color:var(--mu2)}
.pNext{padding:0 4px;display:flex;flex-direction:column;min-width:0}
.pNext small{font-size:12px;color:var(--mu2)}
.pNext b{font-family:var(--ti);font-size:16px;font-weight:600;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.showBar{position:absolute;left:24px;bottom:24px;width:52px;height:52px;border-radius:50%;background:rgba(31,33,37,.55);color:var(--mu2);border:1px solid #2A2D33;display:none;align-items:center;justify-content:center}
#play.barHidden .pBarWrap{display:none}
#play.manual .onlyAuto{display:none}
#play:not(.manual) .onlyMan{display:none}
.pb.mode.on{background:var(--amT);color:#F4C77A}
.pPart{min-width:118px;text-align:center;display:flex;flex-direction:column;gap:2px}
.pPart b{font-size:18px;font-weight:800;color:var(--tx);white-space:nowrap}
.pPart small{font-size:12px;color:var(--mu2)}
#play.manual .marker{display:none}
.pInner.paged{padding:18px 56px 0}
.pInner.paged.pdf{padding:14px 24px 0}
.pInner.paged .part,.pInner.paged .pdfPage,.pInner.paged .endHint{display:none}
.pInner.paged .part.on,.pInner.paged .pdfPage.on{display:block}
.pInner.paged .ln{opacity:1}
.pInner.paged .part>.sec:first-child{margin-top:0}
.pInner.paged .part>.gap:last-child{display:none}
.enter{animation:pgIn .26s ease-out}
@keyframes pgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pb.cast.on{background:#16324A;color:#8FD0FF}
.castDot{width:10px;height:10px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 4px rgba(74,222,128,.18);flex-shrink:0}
.castStat{display:flex;align-items:center;gap:10px;font-weight:700;color:#9BE3B5}
.castBox{background:#141518;border:1px solid var(--ln2);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.castBox b{font-size:16px}
.castBox p{margin:0;color:var(--mu);font-size:14px;line-height:1.6}
.ccList{display:flex;flex-direction:column;gap:8px}
.ccDev{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--p1);border:1px solid #2A2D33;border-radius:12px;color:#8FD0FF}
.ccDev.on{border-color:#2F6A96;background:#122434}
.ccDev b{display:block;color:var(--tx);font-size:16px}
.ccDev small{display:block;color:var(--mu);font-size:13px}
.castBox .row .btn .spin{width:16px;height:16px;border-width:2px}

function srcOf(s,p){return p.ref?(s.parts.find(x=>x.id===p.ref)||null):p}

 const tot={},n={},m={};
 s.parts.forEach(p=>{if(!p.ref)tot[p.type]=(tot[p.type]||0)+1});
 s.parts.forEach(p=>{if(!p.ref){n[p.type]=(n[p.type]||0)+1;m[p.id]=TYPES[p.type].name+(tot[p.type]>1&&p.type!=='note'?' '+n[p.type]:'')}});
 s.parts.forEach(p=>{if(p.ref)m[p.id]=m[p.ref]||TYPES[p.type].name});
 return m;
}
function summarize(parts){

}

/* ========= auto split ========= */
const HDR=/^\s*[\[(]?\s*(בית|פזמון|פיזמון|גשר|מעבר|קודה|סיום|פתיחה|הערה|verse|chorus|pre-?chorus|bridge|intro|outro)\s*(\d+|[א-ו]['׳]?)?\s*[\])]?\s*[:：\-–]?\s*(?:[x×]\s*\d+|\d+\s*[x×])?\s*[\])]?\s*$/i;
const HDR_INLINE=/^\s*(בית\s*\d*|פזמון|פיזמון|גשר|chorus|verse\s*\d*|bridge)\s*[:：]\s*(.+)$/i;
function hdrType(w){w=w.toLowerCase();if(/פזמון|פיזמון|^chorus/.test(w))return 'chorus';if(/גשר|מעבר|bridge|pre|קודה|סיום|outro|פתיחה|intro/.test(w))return 'bridge';if(/הערה/.test(w))return 'note';return 'verse'}
function normKey(t){return t.split('\n').map(l=>l.trim().replace(/[.,!?״"'׳\-–:;()]/g,'').replace(/\s+/g,' ')).filter(Boolean).join('\n')}
function autoSplit(raw){
 const text=String(raw||'').replace(/\r\n?/g,'\n').replace(/\u00a0/g,' ');
 const blocks=text.split(/\n[ \t]*\n+/).map(b=>b.split('\n').map(l=>l.replace(/\s+$/,'').replace(/^\s+/,'')).filter(l=>l!=='').join('\n')).filter(Boolean);
 const pre=blocks.map(b=>{
  let lines=b.split('\n'),type=null;
  const m=lines[0].match(HDR);
  if(m){type=hdrType(m[1]);lines=lines.slice(1)}
  else{const mi=lines[0].match(HDR_INLINE);if(mi){type=hdrType(mi[1]);lines[0]=mi[2].trim()}}
  return {type,text:lines.join('\n').trim()};
 });
 const cnt={};pre.forEach(p=>{if(p.text){const k=normKey(p.text);cnt[k]=(cnt[k]||0)+1}});
 const parts=[],seen={},last={};
 pre.forEach(p=>{
  if(!p.text){const t=p.type||'chorus';const src=last[t];if(src)parts.push({id:uid(),type:t,text:'',ref:src.id});return}
  const k=normKey(p.text);
  if(seen[k]){parts.push({id:uid(),type:seen[k].type,text:'',ref:seen[k].id});return}
  const type=p.type||(cnt[k]>1?'chorus':'verse');
  const part={id:uid(),type,text:p.text,ref:null};
  parts.push(part);seen[k]=part;last[type]=part;
 });
 return parts;
}

function moveSong(id,dir){
 const list=visibleSongs();const i=list.findIndex(s=>s.id===id);const j=i+dir;
 if(i<0||j<0||j>=list.length)return;
 let vals=list.map(s=>s.order||0).sort((a,b)=>a-b);
 if(new Set(vals).size<vals.length){const base=S.songs.reduce((m,s)=>Math.max(m,s.order||0),0);vals=list.map((_,k)=>base+k+1)}
 const [x]=list.splice(i,1);list.splice(j,0,x);
 list.forEach((s,k)=>s.order=vals[k]);
 save();renderLib();
}
function newSong(){
 const f=S.folders.some(x=>x.id===S.ui.folder)?S.ui.folder:null;
 const s=newSongObj({folderId:f});S.songs.push(s);save(true);
 openEditor(s.id);setTimeout(()=>{const t=$('#edTitle');t.focus();t.select()},80);
}
function cloneSong(s){
 const c=clone(s);c.id=uid();c.title=s.title+' (עותק)';c.order=S.songs.reduce((m,x)=>Math.max(m,x.order||0),0)+1;c.created=c.updated=Date.now();
 const map={};c.parts.forEach(p=>{const n=uid();map[p.id]=n;p.id=n});c.parts.forEach(p=>{if(p.ref)p.ref=map[p.ref]});
 return c;
}
function deleteSong(id){
 const s=S.songs.find(x=>x.id===id);if(!s)return;
 S.songs=S.songs.filter(x=>x.id!==id);
 if(s.pdfId&&!S.songs.some(x=>x.pdfId===s.pdfId)){IDB.del(s.pdfId);delete docCache[s.pdfId]}
 save(true);
}
function chooseFolder(title,curId,cb){
 menu(title,[{icon:'folder',label:'ללא תיקייה',cur:!curId,fn:()=>cb(null)}].concat(S.folders.map(f=>({icon:'folder',label:f.name,cur:f.id===curId,fn:()=>cb(f.id)}))));
}
function songMenu(id){
 const s=S.songs.find(x=>x.id===id);if(!s)return;
 menu(s.title,[
  {icon:'edit',label:'עריכה',fn:()=>openEditor(id)},
  {icon:'play',label:'הצג במצב הופעה',fn:()=>{const l=visibleSongs().map(x=>x.id);startShow(l,l.indexOf(id))}},
  {icon:s.fav?'starF':'star',label:s.fav?'הסר ממועדפים':'הוסף למועדפים',fn:()=>{s.fav=!s.fav;save();renderLib()}},
  {icon:'move',label:'העבר לתיקייה',fn:()=>chooseFolder('העבר לתיקייה',s.folderId,f=>{s.folderId=f;touch(s);renderLib();toast('השיר הועבר')})},
  {icon:'copy',label:'שכפל',fn:()=>{S.songs.push(cloneSong(s));save();renderLib();toast('נוצר עותק')}},
  {icon:'trash',label:'מחק שיר',danger:true,fn:()=>confirmBox('למחוק את "'+s.title+'"?','השיר יימחק מהמכשיר ואי אפשר לשחזר אותו.','מחק',()=>{deleteSong(id);renderLib();toast('השיר נמחק')})}
 ]);
}
function folderMenu(fid){
 const f=S.folders.find(x=>x.id===fid);if(!f)return;
 menu(f.name,[
  {icon:'edit',label:'שנה שם',fn:()=>ask('שם התיקייה',f.name,'שמור',v=>{f.name=v;save();renderLib()})},
  {icon:'trash',label:'מחק תיקייה',danger:true,fn:()=>confirmBox('למחוק את התיקייה "'+f.name+'"?','השירים שבתוכה יישארו בספרייה, בלי תיקייה.','מחק תיקייה',()=>{S.folders=S.folders.filter(x=>x.id!==fid);S.songs.forEach(s=>{if(s.folderId===fid)s.folderId=null});S.ui.folder='all';save(true);renderLib()})}
 ]);
}
$('#lib').addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.f){S.ui.folder=d.f;LIB.reorder=false;save();renderLib();$('#grid').scrollTop=0;return}
 if(d.fm)return folderMenu(d.fm);
 if(t.id==='newFold')return ask('תיקייה חדשה','','צור תיקייה',v=>{const f={id:uid(),name:v};S.folders.push(f);S.ui.folder=f.id;save();renderLib()});
 if(d.sort){S.ui.sort=d.sort;LIB.reorder=false;save();renderLib();return}
 if(t.id==='navHide'||t.id==='navShow'){S.ui.navHidden=t.id==='navHide';save();renderLib();return}
 if(t.id==='reorderBtn'){LIB.reorder=!LIB.reorder;renderLib();return}
 if(d.open)return openEditor(d.open);
 if(d.play){const l=visibleSongs().map(s=>s.id);return startShow(l,l.indexOf(d.play))}
 if(d.sm)return songMenu(d.sm);
 if(d.up)return moveSong(d.up,-1);
 if(d.down)return moveSong(d.down,1);
 if(t.id==='startSet')return startShow(visibleSongs().map(s=>s.id),0);
 if(t.id==='libNew'||t.id==='emptyNew')return newSong();
 if(t.id==='libImport'||t.id==='emptyImp')return openImp();
 if(t.id==='libWeb'||t.id==='emptyWeb')return openWeb();
});
$('#q').addEventListener('input',()=>{LIB.reorder=false;renderLib()});

/* ========= editor ========= */
const ED={id:null};
function curSong(){return S.songs.find(s=>s.id===ED.id)}
function openEditor(id){ED.id=id;show('edit');renderEditor();$('#blocks').scrollTop=0}
function closeEditor(){save(true);show('lib');renderLib()}
function renderEditor(){
 const s=curSong();if(!s)return closeEditor();
 $('#edTitle').value=s.title;$('#edArtist').value=s.artist||'';
 $('#edFolder').innerHTML='<option value="">ללא תיקייה</option>'+S.folders.map(f=>'<option value="'+f.id+'">'+esc(f.name)+'</option>').join('');
 $('#edFolder').value=s.folderId&&S.folders.some(f=>f.id===s.folderId)?s.folderId:'';
 $('#edPaste').hidden=s.kind==='pdf';
 renderStruct();renderBlocks();renderStyle();
}
function renderStruct(){
 const s=curSong(),E=$('#struct');
 if(s.kind==='pdf'){E.innerHTML='<div class="lbl">מבנה השיר</div><div class="hint">השיר מוצג כקובץ PDF. המר אותו לטקסט כדי לחלק לבתים ופזמונים.</div>';return}
 const L=labelMap(s),n=s.parts.length;
 E.innerHTML='<div class="lbl">מבנה השיר</div>'+(n?s.parts.map((p,i)=>{const src=srcOf(s,p)||p;return '<div class="sItem"><button class="sName" data-go="'+p.id+'"><span class="dot t-'+src.type+'"></span><span class="nm">'+esc(L[p.id])+'</span>'+(p.ref?'<span class="rep">חוזר</span>':'')+'</button><button class="mv" data-mv="'+p.id+'" data-dir="-1" '+(i===0?'disabled':'')+' aria-label="הזז למעלה">'+ic('up',16)+'</button><button class="mv" data-mv="'+p.id+'" data-dir="1" '+(i===n-1?'disabled':'')+' aria-label="הזז למטה">'+ic('down',16)+'</button></div>'}).join(''):'<div class="hint">עדיין אין חלקים.</div>')+
 '<div class="hint">החצים משנים את סדר החלקים. פזמון שחוזר נכתב פעם אחת, והחזרות שלו מתעדכנות לבד.</div>';
}
function autosize(t){t.style.height='auto';t.style.height=t.scrollHeight+'px'}
function block(s,p,L){
 const src=srcOf(s,p)||p,st=s.style,f=font(st.font);
 const n=p.ref?0:p.text.split('\n').filter(l=>l.trim()).length;
 const sel=p.ref?'<span class="chip t-'+src.type+'">'+TYPES[src.type].name+'</span>':
  '<select class="chip t-'+p.type+'" data-type="'+p.id+'" aria-label="סוג החלק">'+Object.keys(TYPES).map(k=>'<option value="'+k+'"'+(k===p.type?' selected':'')+'>'+TYPES[k].name+'</option>').join('')+'</select>';
 const body=p.ref?'<div class="reptext" data-reptext="'+src.id+'" style="font-family:'+f.css+'">'+esc(src.text)+'</div>':
  '<textarea data-txt="'+p.id+'" rows="1" spellcheck="false" style="color:'+st.colors[p.type]+';font-family:'+f.css+';font-weight:'+f.w+(p.type==='note'?';font-style:italic;font-size:18px':'')+'" placeholder="'+(p.type==='note'?'הערה לזמר, למשל: סולו גיטרה, חוזר פעמיים':'כתוב כאן את השורות…')+'">'+esc(p.text)+'</textarea>';
 return '<div class="block'+(p.ref?' ref':'')+'" id="b-'+p.id+'"><div class="bHead">'+sel+'<span class="cnt" data-cnt="'+p.id+'">'+esc(L[p.id])+' · '+(p.ref?'חוזר':lineTxt(n))+'</span><span class="flex1"></span>'+
  (p.ref?'<button class="btn sm" data-unlink="'+p.id+'">'+ic('edit',16)+'ערוך בנפרד</button>':'')+
  '<button class="ib sm" data-rep="'+p.id+'" aria-label="חזור על החלק הזה">'+ic('repeat',17)+'</button><button class="ib sm danger" data-del="'+p.id+'" aria-label="מחק חלק">'+ic('trash',17)+'</button></div>'+body+'</div>';
}
function renderBlocks(){
 const s=curSong(),B=$('#blocks'),top=B.scrollTop;
 if(s.kind==='pdf'){
  B.innerHTML='<div class="pdfCard"><div class="pdfPrev" id="pdfPrev"><span class="spin"></span></div><div class="pdfInfoBox"><b>'+esc(s.pdfName||'קובץ PDF')+'</b><span>'+pagesTxt(s)+'</span><p>בהופעה השיר יוצג כמו שהוא בקובץ, עם גלילה אוטומטית. כדי לשנות גופן, צבעים וחלוקה לבתים — המר אותו לטקסט.</p><button class="btn pri" id="toText">'+ic('text',18)+'המר לטקסט עריך</button></div></div>';
  pdfById(s.pdfId).then(d=>renderPage(d,s.from||1,260)).then(c=>{const w=$('#pdfPrev');if(w){w.innerHTML='';w.appendChild(c)}}).catch(()=>{const w=$('#pdfPrev');if(w)w.textContent='הקובץ לא נמצא'});
  return;
 }
 if(!s.parts.length){
  B.innerHTML='<div class="emptyEd"><h2>כתוב או הדבק את מילות השיר</h2><p>השאר שורה ריקה בין בית לבית. פזמון שחוזר כמה פעמים יזוהה לבד. אפשר גם לכתוב כותרות כמו "פזמון:" או "בית 2".</p><textarea id="firstText" class="bigText" placeholder="מילות השיר…"></textarea><div class="addRow"><button class="btn pri" id="firstSplit">'+ic('check',18)+'חלק לבתים ופזמונים</button><button class="btn" data-add="verse">התחל מבית ריק</button></div></div>';
  return;
 }
 const L=labelMap(s);
 const row=id=>'<div class="addRow mini"><button class="btn dash ad-verse" data-add="verse" data-after="'+id+'">+ בית</button><button class="btn dash ad-chorus" data-add="chorus" data-after="'+id+'">+ פזמון</button><button class="btn dash ad-bridge" data-add="bridge" data-after="'+id+'">+ גשר</button><button class="btn dash ad-note" data-add="note" data-after="'+id+'">+ הערה לזמר</button><button class="btn dash ad-chorus" data-repchorus="1" data-after="'+id+'">'+ic('repeat',15)+'חזור על פזמון</button></div>';
 B.innerHTML=s.parts.map(p=>block(s,p,L)+row(p.id)).join('');
 $$('#blocks textarea[data-txt]').forEach(autosize);
 B.scrollTop=top;
}
function refreshParts(){renderStruct();renderBlocks();updatePreview()}
function focusPart(id){const b=$('#b-'+id);if(!b)return;b.scrollIntoView({behavior:'smooth',block:'center'});const t=$('textarea',b);if(t)setTimeout(()=>t.focus({preventScroll:true}),250)}
function insertAt(s,after){const i=after?s.parts.findIndex(x=>x.id===after):-1;return i<0?s.parts.length:i+1}
function addPart(type,after){const s=curSong();const p={id:uid(),type,text:'',ref:null};s.parts.splice(insertAt(s,after),0,p);touch(s);refreshParts();focusPart(p.id)}
$('#blocks').addEventListener('input',e=>{
 const t=e.target;if(!t.dataset.txt)return;
 const s=curSong(),p=s.parts.find(x=>x.id===t.dataset.txt);if(!p)return;
 p.text=t.value;autosize(t);touch(s);
 const c=$('[data-cnt="'+p.id+'"]');if(c)c.textContent=labelMap(s)[p.id]+' · '+lineTxt(p.text.split('\n').filter(l=>l.trim()).length);
 $$('[data-reptext="'+p.id+'"]').forEach(x=>x.textContent=p.text);
 updatePreview();
});
$('#blocks').addEventListener('change',e=>{
 const t=e.target;if(!t.dataset.type)return;
 const s=curSong(),p=s.parts.find(x=>x.id===t.dataset.type);if(!p)return;
 p.type=t.value;s.parts.forEach(x=>{if(x.ref===p.id)x.type=p.type});touch(s);refreshParts();
});
$('#blocks').addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;const d=t.dataset,s=curSong();
 if(d.add)return addPart(d.add,d.after);
 if(t.id==='firstSplit'){const parts=autoSplit($('#firstText').value);if(!parts.length)return toast('כתוב או הדבק קודם את המילים');s.parts=parts;touch(s);refreshParts();return toast('חולק ל-'+parts.length+' חלקים — אפשר לתקן בכל רגע')}
 if(d.repchorus){const at=insertAt(s,d.after),all=s.parts.filter(p=>p.type==='chorus'&&!p.ref);const ch=s.parts.slice(0,at).filter(p=>p.type==='chorus'&&!p.ref).pop()||all[0];if(!ch)return toast('עדיין אין פזמון בשיר');const p={id:uid(),type:'chorus',text:'',ref:ch.id};s.parts.splice(at,0,p);touch(s);refreshParts();return focusPart(p.id)}
 if(d.rep){const i=s.parts.findIndex(x=>x.id===d.rep);const src=srcOf(s,s.parts[i]);if(!src)return;s.parts.splice(i+1,0,{id:uid(),type:src.type,text:'',ref:src.id});touch(s);return refreshParts()}
 if(d.unlink){const p=s.parts.find(x=>x.id===d.unlink),src=srcOf(s,p);if(src){p.text=src.text;p.type=src.type}p.ref=null;touch(s);refreshParts();return focusPart(p.id)}
 if(d.del){
  const p=s.parts.find(x=>x.id===d.del);const refs=s.parts.filter(x=>x.ref===p.id);
  const go=()=>{s.parts=s.parts.filter(x=>x.id!==p.id&&x.ref!==p.id);touch(s);refreshParts()};
  if(refs.length)return confirmBox('למחוק את החלק?','החלק הזה חוזר עוד '+(refs.length===1?'פעם אחת':refs.length+' פעמים')+' בשיר, וגם החזרות יימחקו.','מחק',go);
  if(p.text.trim())return confirmBox('למחוק את החלק?','הטקסט של החלק יימחק.','מחק',go);
  return go();
 }
 if(t.id==='toText')return pdfToText(s);
});
$('#struct').addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;const s=curSong();
 if(t.dataset.go)return focusPart(t.dataset.go);
 if(t.dataset.mv){const i=s.parts.findIndex(x=>x.id===t.dataset.mv),j=i+(+t.dataset.dir);if(j<0||j>=s.parts.length)return;const[x]=s.parts.splice(i,1);s.parts.splice(j,0,x);touch(s);refreshParts()}
});
$('#edTitle').addEventListener('input',e=>{const s=curSong();s.title=e.target.value;touch(s)});
$('#edArtist').addEventListener('input',e=>{const s=curSong();s.artist=e.target.value;touch(s)});
$('#edFolder').addEventListener('change',e=>{const s=curSong();s.folderId=e.target.value||null;touch(s)});
$('#edBack').onclick=closeEditor;
$('#edSave').onclick=()=>{save(true);toast('השיר נשמר')};
$('#edPlay').onclick=()=>{const s=curSong();save(true);if(s.kind!=='pdf'&&!resolve(s).some(p=>p.text.trim()))return toast('הוסף מילים לפני מצב הופעה');startShow([s.id],0)};
$('#edPaste').onclick=pasteModal;
function pasteModal(){
 const s=curSong();
 openModal('<h2>הדבקת טקסט</h2><p class="mTxt">הדבק את מילות השיר. שורה ריקה מפרידה בין חלקים, ופזמון שחוזר יזוהה לבד. אפשר גם לכתוב כותרות כמו "פזמון:" או "בית 2".</p><textarea class="bigText" id="mPaste" autofocus></textarea>'+
  (s.parts.length?'<div class="seg full" id="mMode"><button class="on" data-m="replace">החלף את הטקסט הקיים</button><button data-m="append">הוסף בסוף השיר</button></div>':'')+
  '<div class="acts"><button class="btn pri" id="mSplit">'+ic('check',18)+'חלק לבתים ופזמונים</button><button class="btn" id="mCancel">ביטול</button></div>',true);
 let mode='replace';
 $$('#mMode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;$$('#mMode button').forEach(x=>x.classList.toggle('on',x===b))});
 $('#mCancel').onclick=closeModal;
 $('#mSplit').onclick=()=>{const parts=autoSplit($('#mPaste').value);if(!parts.length)return toast('לא נמצא טקסט להדבקה');if(mode==='append')s.parts=s.parts.concat(parts);else s.parts=parts;touch(s);closeModal();refreshParts();toast('חולק ל-'+parts.length+' חלקים')};
}
function renderStyle(){
 const s=curSong(),st=s.style,E=$('#style');
 if(s.kind==='pdf'){E.innerHTML='<div class="grp"><div class="lbl">תצוגה בהופעה</div><label class="tgl"><input type="checkbox" id="stInv"'+(s.invert?' checked':'')+'><span>היפוך צבעים: רקע כהה וטקסט בהיר</span></label><div class="hint">מומלץ על במה חשוכה — דף לבן מסנוור.</div></div>';return}
 const cn={verse:'בית',chorus:'פזמון',bridge:'גשר',note:'הערה'};
 E.innerHTML='<div class="grp"><div class="lbl">גופן</div><div class="fonts">'+FONTS.map(f=>'<button class="fontBtn'+(st.font===f.id?' on':'')+'" data-font="'+f.id+'" style="font-family:'+f.css+';font-weight:'+f.w+'">'+f.label+'</button>').join('')+'</div></div>'+
 '<div class="grp"><div class="row"><label class="lbl flex1" for="stSize">גודל טקסט בהופעה</label><b id="stSizeV">'+st.size+'</b></div><input id="stSize" type="range" min="28" max="160" step="2" value="'+st.size+'"></div>'+
 '<div class="grp"><div class="row"><label class="lbl flex1" for="stLh">ריווח שורות</label><b id="stLhV">'+st.lh.toFixed(2)+'</b></div><input id="stLh" type="range" min="1.05" max="1.9" step="0.05" value="'+st.lh+'"></div>'+
 '<div class="grp"><div class="lbl">צבע לפי חלק</div>'+Object.keys(SW).map(t=>'<div class="swRow"><span class="nm">'+cn[t]+'</span>'+SW[t].map(c=>'<button class="sw'+(st.colors[t].toLowerCase()===c.toLowerCase()?' on':'')+'" style="background:'+c+'" data-col="'+t+'" data-c="'+c+'" aria-label="צבע '+c+'"></button>').join('')+'<input type="color" data-colin="'+t+'" value="'+st.colors[t]+'" aria-label="צבע מותאם ל'+cn[t]+'"></div>').join('')+'</div>'+
 '<div class="grp"><div class="lbl">יישור</div><div class="seg full"><button data-al="center" class="'+(st.align==='center'?'on':'')+'">מרכז</button><button data-al="right" class="'+(st.align==='right'?'on':'')+'">ימין</button></div></div>'+
 '<label class="tgl"><input type="checkbox" id="stLabels"'+(st.labels?' checked':'')+'><span>הצג שמות חלקים בהופעה</span></label>'+
 '<div class="preview" id="stPrev"></div>'+
 '<button class="btn sm" id="stDefault">קבע כברירת מחדל לשירים חדשים</button>';
 updatePreview();
}
function updatePreview(){
 const s=curSong(),P=$('#stPrev');if(!P||!s||s.kind==='pdf')return;
 const st=s.style,f=font(st.font),r=resolve(s),first=p=>p.text.split('\n').find(l=>l.trim());
 const L=[];const v=r.find(p=>p.type==='verse'&&p.text.trim()),c=r.find(p=>p.type==='chorus'&&p.text.trim());
 if(v)L.push([first(v),st.colors.verse]);if(c)L.push([first(c),st.colors.chorus]);if(!L.length)L.push(['שורה לדוגמה',st.colors.verse]);
 const fs=Math.max(14,Math.round(st.size*.3));
 P.innerHTML='<div class="pvL">תצוגה מקדימה</div>'+L.map(x=>'<div style="font-family:'+f.css+';font-weight:'+f.w+';font-size:'+fs+'px;line-height:'+st.lh+';color:'+x[1]+';text-align:'+st.align+'">'+esc(x[0])+'</div>').join('');
}
$('#style').addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;const s=curSong(),st=s.style,d=t.dataset;
 if(d.font){st.font=d.font;touch(s);renderBlocks();renderStyle();return}
 if(d.col){st.colors[d.col]=d.c;touch(s);renderBlocks();renderStyle();return}
 if(d.al){st.align=d.al;touch(s);renderStyle();return}
 if(t.id==='stDefault'){S.defStyle=clone(st);save();toast('העיצוב הזה יחול על שירים חדשים')}
});
$('#style').addEventListener('input',e=>{
 const t=e.target,s=curSong(),st=s.style;
 if(t.id==='stSize'){st.size=+t.value;$('#stSizeV').textContent=st.size;touch(s);updatePreview()}
 else if(t.id==='stLh'){st.lh=+t.value;$('#stLhV').textContent=st.lh.toFixed(2);touch(s);updatePreview()}
});
$('#style').addEventListener('change',e=>{
 const t=e.target,s=curSong();

if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';
const docCache={};
function openPdf(buf){return pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0)),isEvalSupported:false}).promise}
async function pdfById(id){if(docCache[id])return docCache[id];const buf=await IDB.get(id);if(!buf)throw new Error('missing');return docCache[id]=await openPdf(buf)}
async function renderPage(doc,n,width){
 const pg=await doc.getPage(n);const v1=pg.getViewport({scale:1});
 const dpr=Math.min(window.devicePixelRatio||1,2),vp=pg.getViewport({scale:width/v1.width*dpr});
 const c=document.createElement('canvas');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);c.style.width=width+'px';
 const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
 await pg.render({canvasContext:ctx,viewport:vp}).promise;return c;
}
const HEB=/[\u0590-\u05FF]/;
async function pageText(doc,n){
 const pg=await doc.getPage(n);const tc=await pg.getTextContent();
 const items=tc.items.filter(i=>typeof i.str==='string'&&i.str.trim()!=='').map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width||0,h:Math.abs(i.transform[3])||i.height||10}));
 if(!items.length)return '';
 items.sort((a,b)=>b.y-a.y);
 const lines=[];
 items.forEach(it=>{let L=null;for(let k=lines.length-1;k>=0&&k>=lines.length-4;k--){if(Math.abs(lines[k].y-it.y)<Math.max(lines[k].h,it.h)*.45){L=lines[k];break}}if(L){L.items.push(it);L.h=Math.max(L.h,it.h)}else lines.push({y:it.y,h:it.h,items:[it]})});
 lines.sort((a,b)=>b.y-a.y);
 const gaps=[];for(let i=1;i<lines.length;i++)gaps.push(lines[i-1].y-lines[i].y);
 const med=gaps.length?gaps.slice().sort((a,b)=>a-b)[Math.floor(gaps.length/2)]:0;
 const out=[];
 lines.forEach((l,i)=>{
  const rtl=l.items.some(t=>HEB.test(t.s));
  l.items.sort((a,b)=>rtl?b.x-a.x:a.x-b.x);
  let txt='';
  l.items.forEach((t,j)=>{if(j){const p=l.items[j-1];const gap=rtl?p.x-(t.x+t.w):t.x-(p.x+p.w);if(gap>l.h*.2&&!/\s$/.test(txt)&&!/^\s/.test(t.s))txt+=' '}txt+=t.s});
  if(i&&med>0&&lines[i-1].y-l.y>med*1.55)out.push('');
  out.push(txt.replace(/\s+/g,' ').trim());
 });
 return out.join('\n');
}
async function pdfToText(s){
 try{
  const doc=await pdfById(s.pdfId);const arr=[];
  for(let n=s.from||1;n<=(s.to||doc.numPages);n++)arr.push(await pageText(doc,n));
  const txt=arr.join('\n\n');
  if(txt.replace(/\s/g,'').length<15)return toast('לא נמצא טקסט בקובץ — כנראה שהוא סרוק, ולכן יוצג כמו שהוא');
  const lines=txt.split('\n');while(lines.length&&!lines[0].trim())lines.shift();
  if(lines.length&&lines[0].trim()===s.title.trim())lines.shift();
  s.parts=autoSplit(lines.join('\n'));const pid=s.pdfId;
  s.kind='text';delete s.pdfId;delete s.from;delete s.to;delete s.pdfName;touch(s);
  if(!S.songs.some(x=>x.pdfId===pid)){IDB.del(pid);delete docCache[pid]}
  renderEditor();toast('הומר לטקסט — כדאי לעבור על החלוקה');
 }catch(e){toast('לא ניתן לקרוא את הקובץ')}
}

const CHORD_LINE=/^(\s*[A-H][#b♯♭]?(m|maj|min|dim|aug|sus|add|M)?\d*(\/[A-H][#b]?)?\s*)+$/;
function nodeText(el){
 let out='';
 const walk=n=>{
  if(n.nodeType===3){out+=n.nodeValue.replace(/[\t\r\n]+/g,' ');return}
  if(n.nodeType!==1)return;
  const tg=n.tagName.toUpperCase();
  if(/^(SCRIPT|STYLE|NOSCRIPT|BUTTON|SELECT|IFRAME|SVG|FORM|INPUT)$/.test(tg))return;
  if(n.classList&&(n.classList.contains('chords')||n.classList.contains('chords_en')))return;
  if(tg==='BR'){out+='\n';return}
  const blk=/^(DIV|LI|TR|H\d|SECTION|ARTICLE|TABLE|PRE|BLOCKQUOTE)$/.test(tg),para=tg==='P';
  if(para)out+='\n\n';else if(blk)out+='\n';
  n.childNodes.forEach(walk);
  if(para)out+='\n\n';else if(blk)out+='\n';
 };
 walk(el);return out;
}
function cleanLyr(t){
 const L=t.replace(/\u00a0/g,' ').split('\n').map(l=>l.replace(/\s+/g,' ').trim()).filter(l=>!CHORD_LINE.test(l)||!l);
 return L.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
function bestBlock(d){
 let best=null,bs=0;
 $$('div,p,span,pre,td,section,article',d.body).forEach(el=>{
  let score=el.querySelectorAll(':scope > br').length;
  if(el.tagName==='PRE')score=(el.textContent.match(/\n/g)||[]).length;
  const ps=el.querySelectorAll(':scope > p');
  if(ps.length>=2){let pb=0;ps.forEach(p=>pb+=p.querySelectorAll('br').length+1);score=Math.max(score,pb)}
  if(score<4)return;
  const txt=el.textContent||'';const links=$$('a',el).reduce((a,x)=>a+x.textContent.length,0);
  if(links>txt.length*.3)return;
  if(txt.length/(score+1)>90)return;
  if(score>bs){bs=score;best=el}
 });
 return best;
}
function addBreaks(text){
 if(/\n\s*\n/.test(text))return text;
 const L=text.split('\n').map(s=>s.trim()).filter(Boolean);if(L.length<8)return text;
 const K=L.map(s=>s.replace(/[^\p{L}\p{N} ]/gu,'').toLowerCase());
 const br=new Set();
 for(let w=6;w>=2&&!br.size;w--){
  for(let i=0;i+w<=K.length;i++){const seq=K.slice(i,i+w).join('|');
   for(let j=i+w;j+w<=K.length;j++){if(K.slice(j,j+w).join('|')===seq){br.add(i);br.add(i+w);br.add(j);br.add(j+w)}}}
 }
 const cuts=[...br].filter(x=>x>0&&x<L.length).sort((a,b)=>a-b);
 const segs=[];let st=0;cuts.concat([L.length]).forEach(c=>{if(c>st){segs.push(L.slice(st,c));st=c}});
 const out=[];segs.forEach(sg=>{if(sg.length>6){for(let k=0;k<sg.length;k+=4)out.push(sg.slice(k,k+4))}else out.push(sg)});
 return out.map(x=>x.join('\n')).join('\n\n');
}
function parseTitle(t){
 t=(t||'').replace(/\s+/g,' ').trim();let m;
 if((m=t.match(/מילים לשיר\s+(.+?)\s+-\s+(.+?)\s+-/)))return {title:m[1],artist:m[2]};
 if((m=t.match(/^(.+?)\s+[-–]\s+(.+?)\s+(lyrics|מילים)/i)))return {title:m[2],artist:m[1]};
 t=t.replace(/\s*[|–-]\s*[^|–-]*$/,'').replace(/^(מילים לשיר|מילים ל|lyrics)\s*/i,'').replace(/\s*(lyrics|מילים)$/i,'').trim();
 return {title:t,artist:''};
}
function extractLyrics(html,url){
 const d=new DOMParser().parseFromString(html,'text/html');
 $$('script,style,noscript,header,footer,nav,aside,form,iframe',d).forEach(e=>e.remove());
 let txt='';
 const rule=SITE_SEL.find(r=>r[0].test(url));
 if(rule){const els=$$(rule[1],d);if(els.length)txt=cleanLyr(els.map(nodeText).join('\n\n'))}
 if(txt.split('\n').filter(Boolean).length<4){const b=bestBlock(d);txt=b?cleanLyr(nodeText(b)):''}
 const og=d.querySelector('meta[property="og:title"]');
 return {text:addBreaks(txt),meta:parseTitle((og&&og.getAttribute('content'))||d.title)};
}

const WEB={q:'',res:[],sel:-1,busy:false,loading:false,cur:null,view:'split',folder:'',saved:null,tok:null};
function openWeb(){WEB.folder=S.folders.some(x=>x.id===S.ui.folder)?S.ui.folder:'';show('web');renderWebRes();renderWebPrev();setTimeout(()=>$('#wq').focus(),80)}
function closeWeb(){WEB.tok=null;show('lib');renderLib()}
async function doWebSearch(){
 const q=$('#wq').value.trim();if(!q)return toast('כתוב שם של שיר או זמר');
 $('#wq').blur();WEB.q=q;WEB.busy=true;WEB.res=[];WEB.sel=-1;WEB.cur=null;renderWebRes();renderWebPrev();
 try{WEB.res=await webSearch(q)}catch(e){WEB.res=[]}
 WEB.busy=false;renderWebRes();renderWebPrev();
 if(WEB.res.length&&window.innerWidth>900)pickWeb(0);
}
function renderWebRes(){
 const E=$('#wRes');
 if(WEB.busy){E.innerHTML='<div class="wMsg"><span class="spin big"></span>מחפש באתרי מילים…</div>';return}
 if(!WEB.q){E.innerHTML='<div class="hint">חפש לפי שם השיר, ואפשר להוסיף את שם הזמר לתוצאות מדויקות יותר.</div>';return}
 if(!WEB.res.length){E.innerHTML='<div class="wMsg">לא נמצאו תוצאות. בדוק את החיבור לאינטרנט או נסה ניסוח אחר.</div>';return}
 E.innerHTML=WEB.res.map((r,i)=>'<button class="wItem'+(WEB.sel===i?' on':'')+'" data-wi="'+i+'"><b>'+esc(r.title)+'</b><span class="dom'+(r.known?' known':'')+'">'+esc(r.demo?'תצוגה מקדימה':hostOf(r.url))+'</span>'+(r.snippet?'<span class="sn">'+esc(r.snippet)+'</span>':'')+'</button>').join('');
}
async function pickWeb(i){
 WEB.sel=i;WEB.cur=null;WEB.saved=null;WEB.loading=true;WEB.view='split';const tok=WEB.tok=uid();
 renderWebRes();renderWebPrev();
 const r=WEB.res[i];
 try{
  const page=await httpGet(r.url);if(tok!==WEB.tok)return;
  const ex=extractLyrics(page.text,page.url||r.url);
  const meta=ex.meta.title?ex.meta:parseTitle(r.title);
  WEB.cur={url:r.url,text:ex.text,title:meta.title||parseTitle(r.title).title,artist:meta.artist||'',parts:autoSplit(ex.text)};
 }catch(e){if(tok!==WEB.tok)return;WEB.cur={error:true,url:r.url}}
 WEB.loading=false;renderWebPrev();
}
function renderWebPrev(){
 const E=$('#wPrev'),c=WEB.cur;
 if(WEB.loading){E.innerHTML='<div class="wScroll"><div class="wMsg"><span class="spin big"></span>קורא את הדף ומזהה את המילים…</div></div>';return}
 if(!c){E.innerHTML='<div class="wScroll"><div class="wMsg"><h2>חיפוש מילים ברשת</h2>'+(WEB.res.length?'בחר תוצאה כדי לראות את המילים שזוהו.':'המילים נשלפות מהדף, מחולקות לבתים ולפזמונים לפי המרווחים והחזרות, ונשמרות בספרייה שלך. תמיד אפשר לתקן לפני השמירה.')+'</div></div>';return}
 const openBtn=c.url&&!c.url.startsWith('demo:')?'<button class="btn sm" id="wOpen">'+ic('ext',16)+'פתח את הדף</button>':'';
 if(c.error||!c.text||c.text.split('\n').filter(Boolean).length<3){
  E.innerHTML='<div class="wScroll"><div class="wMsg"><h2>לא זוהו מילים בדף הזה</h2>ייתכן שהאתר חוסם גישה או שהמילים לא נמצאות בדף. נסה תוצאה אחרת.'+openBtn+'</div></div>';return;
 }
 const L=labelMap({parts:c.parts});
 const body=WEB.view==='edit'?
  '<textarea class="bigText" id="wText" style="max-width:660px;min-height:50vh" spellcheck="false">'+esc(c.text)+'</textarea><div class="hint" style="max-width:660px">שורה ריקה מפרידה בין חלקים. אחרי התיקון לחץ "חלק מחדש".</div>':
  '<div class="txtView">'+c.parts.map(p=>{const src=p.ref?c.parts.find(q=>q.id===p.ref):p;if(!src)return '';return '<div class="tvPart"><span class="chip t-'+src.type+'">'+esc(L[p.id])+'</span>'+(p.ref?'<span class="tvRep">חוזר</span>':'<div class="tvTxt c-'+src.type+'">'+esc(src.text)+'</div>')+'</div>'}).join('')+'</div>';
 E.innerHTML='<div class="wScroll"><div class="wMeta"><input class="field" id="wTitle" value="'+esc(c.title)+'" aria-label="שם השיר" placeholder="שם השיר"><input class="field" id="wArtist" value="'+esc(c.artist)+'" aria-label="שם הזמר" placeholder="שם הזמר"></div>'+
  '<div class="wMeta"><div class="seg"><button data-wv="split" class="'+(WEB.view==='split'?'on':'')+'">החלוקה שזוהתה</button><button data-wv="edit" class="'+(WEB.view==='edit'?'on':'')+'">עריכת טקסט</button></div><span class="hint">'+esc(summarize(c.parts))+'</span><span class="flex1"></span>'+openBtn+'</div>'+body+'</div>'+
  '<div class="wFoot">'+(WEB.view==='edit'?'<button class="btn" id="wResplit">'+ic('repeat',16)+'חלק מחדש</button>':'')+
  '<select class="field" id="wFolder" aria-label="תיקייה"><option value="">ללא תיקייה</option>'+S.folders.map(f=>'<option value="'+f.id+'"'+(WEB.folder===f.id?' selected':'')+'>'+esc(f.name)+'</option>').join('')+'</select><span class="flex1"></span>'+
  (WEB.saved?'<button class="btn" id="wEdit">'+ic('edit',16)+'פתח בעורך</button><button class="btn" disabled>'+ic('check',16)+'נשמר</button>':'<button class="btn pri" id="wSave">'+ic('check',18)+'שמור לספרייה</button>')+'</div>';
}
function saveWeb(){
 const c=WEB.cur;if(!c)return;
 if(WEB.view==='edit'&&$('#wText')){c.text=$('#wText').value;c.parts=autoSplit(c.text)}
 if(!c.parts.length)return toast('אין מילים לשמירה');
 const s=newSongObj({title:c.title||'שיר חדש',artist:c.artist||'',folderId:WEB.folder||null});
 s.parts=c.parts.map(p=>Object.assign({},p));S.songs.push(s);save(true);
 WEB.saved=s.id;renderWebPrev();toast('השיר נשמר בספרייה');
}
$('#web').addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(t.id==='webClose')return closeWeb();
 if(t.id==='wGo')return doWebSearch();
 if(d.wi)return pickWeb(+d.wi);
 if(d.wv){if(WEB.view==='edit'&&$('#wText')){WEB.cur.text=$('#wText').value;WEB.cur.parts=autoSplit(WEB.cur.text)}WEB.view=d.wv;return renderWebPrev()}
 if(t.id==='wResplit'){WEB.cur.text=$('#wText').value;WEB.cur.parts=autoSplit(WEB.cur.text);WEB.view='split';renderWebPrev();return toast('חולק מחדש')}
 if(t.id==='wSave')return saveWeb();
 if(t.id==='wEdit'){const id=WEB.saved;WEB.tok=null;return openEditor(id)}
 if(t.id==='wOpen'){const u=WEB.cur.url;if(window.Android&&window.Android.openUrl)window.Android.openUrl(u);else window.open(u,'_blank','noopener');}
});
$('#web').addEventListener('input',e=>{const t=e.target,c=WEB.cur;if(!c)return;if(t.id==='wTitle')c.title=t.value;else if(t.id==='wArtist')c.artist=t.value;else if(t.id==='wText')c.text=t.value});
$('#web').addEventListener('change',e=>{if(e.target.id==='wFolder')WEB.folder=e.target.value});
$('#wq').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doWebSearch()}});

/* ========= native bridge ========= */
let _pdfName='',_chunks=[];
window.__pdfBegin=function(name){_pdfName=name;_chunks=[];if(SCREEN!=='imp')openImp();IMP.busy=true;IMP.name=name;renderImp()};
window.__pdfChunk=function(c){_chunks.push(c)};
window.__pdfEnd=function(){
 try{const b=atob(_chunks.join(''));_chunks=[];const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);onPdf(_pdfName,u.buffer)}
 catch(e){IMP.busy=false;renderImp();toast('קריאת הקובץ נכשלה')}
};
window.__pdfError=function(m){IMP.busy=false;renderImp();toast(m)};
window.__pdfCancel=function(){};
window.appBack=function(){
 if(!$('#modalWrap').hidden){closeModal();return true}
 if(SCREEN==='play'){exitShow();return true}
 if(SCREEN==='edit'){closeEditor();return true}
 if(SCREEN==='imp'){closeImp();return true}
 if(SCREEN==='web'){closeWeb();return true}
 return false;
};

/* ========= init ========= */
$$('i[data-ic]').forEach(e=>{e.outerHTML=ic(e.dataset.ic,+e.dataset.s||20)});
$('#srcSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)pickSource(b.dataset.src)});
renderLib();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

/* ========= splash ========= */
(function(){
 const sp=$('#splash');if(!sp)return;
 const DUR=5000,bar=$('#spFillBar'),pct=$('#spPct'),t0=performance.now();
 function frame(now){
  const p=Math.min(1,(now-t0)/DUR),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  bar.style.width=(e*100)+'%';pct.textContent=Math.round(p*100)+'%';
  if(p<1)requestAnimationFrame(frame);
  else setTimeout(()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),650)},300);
 }
 requestAnimationFrame(frame);
})();
</script>
