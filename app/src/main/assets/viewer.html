<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>StagePromt – מסך במה</title>
<link rel="stylesheet" href="fonts.css">
<style>
html,body{margin:0;height:100%;background:#000;color:#F2EEE6;overflow:hidden;font-family:'Assistant',sans-serif;cursor:none}
#idle{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#idle img{width:min(62vw,900px);height:auto;opacity:.92}
#idle.off{opacity:0;pointer-events:none}
#hdr{position:fixed;top:0;left:0;right:0;height:7vh;min-height:34px;display:flex;align-items:center;gap:2vw;padding:0 3vw;font-family:'Rubik','Assistant',sans-serif;font-weight:600;font-size:max(15px,2.4vh);color:#8F897F;z-index:2;background:linear-gradient(#000 70%,rgba(0,0,0,0))}
#hdr[hidden]{display:none}
#hdr b{color:#CFC9BF;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr .fl{flex:1}
#sc{position:fixed;left:0;right:0;top:0;bottom:0;overflow:hidden}
#in{margin:0 auto;padding:0 4vw;max-width:1500px;font-weight:800;will-change:transform}
#in.mirror{transform:scaleX(-1)}
.ln{opacity:.55;transition:opacity .25s}
.ln.past{opacity:.22}
.ln.cur{opacity:1}
.ln.note{font-size:.45em;font-style:italic;font-weight:600;font-family:'Assistant',sans-serif}
.sec{font-family:'Assistant',sans-serif;font-size:max(16px,.26em);font-weight:800;letter-spacing:1px;margin:.9em 0 .1em;opacity:.85}
.gap{height:.45em}
.paged .part{display:none}
.paged .part.on{display:block;animation:pg .28s ease-out}
.paged .ln{opacity:1}
.paged .part>.sec:first-child{margin-top:0}
.paged .part>.gap:last-child{display:none}
@keyframes pg{from{opacity:0;transform:translateY(1.2vh)}to{opacity:1;transform:none}}
#msg{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;padding:0 6vw}
#msg b{font-family:'Rubik','Assistant',sans-serif;font-size:7vh;font-weight:600}
#msg span{font-size:3vh;color:#8F897F}
#dot{position:fixed;left:14px;bottom:14px;width:10px;height:10px;border-radius:50%;background:#E0675C;display:none;z-index:3}
</style>
</head>
<body>
<div id="sc"><div id="in"></div></div>
<div id="hdr" hidden><b id="t"></b><span class="fl"></span><span id="n"></span></div>
<div id="msg"><b id="mt"></b><span id="ms"></span></div>
<div id="idle"><img src="logo.png" alt="StagePromt"></div>
<div id="dot"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let key='',st=null,cur=0,target=0,lines=[],parts=[],raf=0;
function hdrH(){return $('#hdr').hidden?0:$('#hdr').offsetHeight}
function scale(){return Math.min(innerWidth/1180,innerHeight/760)}
function build(s){
 const inn=$('#in');
 inn.style.cssText='font-family:'+s.font+';font-weight:'+s.w+';font-size:'+Math.round(s.size*scale())+'px;text-align:'+s.align+';line-height:'+s.lh;
 let h='';
 s.parts.forEach(p=>{
  h+='<div class="part">';
  if(s.labels)h+='<div class="sec" style="color:'+p.c+'">'+esc(p.n)+'</div>';
  p.x.split('\n').forEach(l=>{h+=l.trim()?'<div class="ln'+(p.t==='note'?' note':'')+'" style="color:'+p.c+'">'+esc(l)+'</div>':'<div class="gap"></div>'});
  if(!s.labels)h+='<div class="gap"></div>';
  h+='</div>';
 });
 inn.innerHTML=h;
 lines=[...inn.querySelectorAll('.ln')];parts=[...inn.querySelectorAll('.part')];
}
function fit(el){
 if(!el)return;el.style.fontSize='';
 const room=innerHeight-hdrH()-Math.round(innerHeight*.05);
 for(let k=0;k<3;k++){const h=el.offsetHeight;if(!h||h<=room)break;const c=parseFloat(el.style.fontSize)||100;el.style.fontSize=Math.max(40,c*room/h*.98)+'%'}
}
function loop(){
 raf=requestAnimationFrame(loop);
 const d=target-cur;if(Math.abs(d)<.5){cur=target}else cur+=d*.12;
 $('#in').style.transform='translateY('+(-cur)+'px)'+(st&&st.mirror?' scaleX(-1)':'');
}
function apply(s){
 st=s;
 if(!s||s.idle){$('#idle').classList.remove('off');$('#hdr').hidden=true;$('#msg').style.display='none';$('#in').innerHTML='';key='';return}
 $('#idle').classList.add('off');
 $('#hdr').hidden=false;$('#t').textContent=s.title+(s.artist?' · '+s.artist:'');
 $('#n').textContent=s.count>1?(s.idx+1)+' / '+s.count:'';
 if(s.kind==='pdf'){
  $('#in').innerHTML='';key='';
  $('#msg').style.display='flex';$('#mt').textContent=s.title;$('#ms').textContent='קובץ PDF – מוצג בטאבלט'+(s.pages?' · עמוד '+(s.page+1)+' מתוך '+s.pages:'');
  return;
 }
 $('#msg').style.display='none';
 const k=JSON.stringify([s.title,s.parts,s.font,s.size,s.lh,s.align,s.labels,innerWidth,innerHeight]);
 const inn=$('#in');
 if(k!==key){key=k;build(s);cur=target=0}
 inn.classList.toggle('paged',!!s.manual);
 if(s.manual){
  parts.forEach((p,i)=>{if(i===s.part){if(!p.classList.contains('on')){p.classList.add('on');fit(p)}}else{p.classList.remove('on');p.style.fontSize=''}});
  inn.style.paddingTop=(hdrH()+Math.round(innerHeight*.02))+'px';
  target=0;cur=0;
 }else{
  parts.forEach(p=>{p.classList.remove('on');p.style.fontSize=''});
  inn.style.paddingTop=Math.round(innerHeight*.45)+'px';inn.style.paddingBottom=Math.round(innerHeight*.8)+'px';
  lines.forEach((l,i)=>{l.classList.toggle('past',i<s.line);l.classList.toggle('cur',i===s.line)});
  const L=lines[Math.max(0,s.line)];
  if(L)target=Math.max(0,L.offsetTop+L.offsetHeight/2-innerHeight*.42);
 }
}
addEventListener('resize',()=>{key='';if(st)apply(st)});
addEventListener('message',e=>{if(e.data&&e.data.rnState)apply(e.data.rnState)});
if(/^https?:$/.test(location.protocol)&&window.EventSource){
 const es=new EventSource('/events');
 es.onmessage=e=>{$('#dot').style.display='none';try{apply(JSON.parse(e.data))}catch(x){}};
 es.onerror=()=>{$('#dot').style.display='block'};
}
loop();
</script>
</body>
</html>
